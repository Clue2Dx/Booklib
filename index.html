<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Library">
<meta name="theme-color" content="#f6f5f2">
<link rel="manifest" href="manifest.webmanifest">
<title>Book Library</title>
<link rel="stylesheet" href="style.css">
</head><body>
<div id="login" hidden><h1>Book Library</h1><form id="lf"><input id="em" type="email" placeholder="Email" autocomplete="username" required><input id="pw" type="password" placeholder="Password" autocomplete="current-password" required><p id="err"></p><button class="pri" style="width:100%">Sign in</button></form></div>
<div id="app" hidden>
<header><div class="top"><button id="menu" data-act="menu" aria-label="Menu">☰</button><h1 id="title"></h1></div><input id="q" type="search" dir="auto" placeholder="Search books, authors, notes"></header>
<main id="main"></main>
<button id="fab" data-act="add" aria-label="Add">+</button>
<div id="side" hidden><div class="bg" data-act="menu"></div><nav><h1>Library</h1><button data-act="nav" data-v="lib">Book Library</button><button data-act="nav" data-v="cats">Book Categories</button><button data-act="nav" data-v="notes">Notes</button><button data-act="bulk">Add many books</button><button data-act="export">Export backup</button><button data-act="import">Import backup</button><input id="imp" type="file" accept="application/json,.json" hidden><div class="sp"></div><div id="stat" class="s"></div><div class="s">Version 5</div><button class="ghost" data-act="signout">Sign out</button></nav></div>
<div id="npage" hidden></div><div id="sheet" hidden></div>
</div><div id="toast" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="app1.js"></script>
<script src="app2.js"></script>
<script src="bulk.js"></script>
</body></html>
